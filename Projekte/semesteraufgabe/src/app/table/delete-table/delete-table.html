<h1 mat-dialog-title>{{ data.headline }}</h1>
<mat-dialog-content class="mat-typography">
  {{ data.info }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Abbrechen</button>
  <button mat-button color="warn" [mat-dialog-close]="true" cdkFocusInitial>Löschen</button>
</mat-dialog-actions>
